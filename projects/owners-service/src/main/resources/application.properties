server.port=8082
spring.application.name=owners-service
spring.datasource.url=${OWNERS_DB_URL:jdbc:h2:file:./data/owners-v2;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

legacy.base-url=${MONOLITH_URL:http://localhost:8080}

# Actuator HTTP is enabled only by the auditoria profile.
management.server.port=-1
