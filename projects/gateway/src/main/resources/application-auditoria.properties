management.server.port=${AUDIT_GATEWAY_MANAGEMENT_PORT:9081}
management.server.address=${AUDIT_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.access.default=none
management.endpoints.access.max-permitted=read-only
management.endpoint.health.access=read-only
management.endpoint.gateway.access=read-only
management.endpoint.metrics.access=read-only
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,gateway,metrics
management.endpoints.web.discovery.enabled=false
spring.cloud.gateway.server.webflux.metrics.enabled=true
