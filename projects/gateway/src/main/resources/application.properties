spring.application.name=petclinic-gateway
server.port=8081

# Bloqueia a API interna no unico ponto de entrada publico.
spring.cloud.gateway.server.webflux.routes[0].id=internal-block
spring.cloud.gateway.server.webflux.routes[0].uri=no://op
spring.cloud.gateway.server.webflux.routes[0].order=-2
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/internal/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetStatus=404

# API Owners - microsservico
spring.cloud.gateway.server.webflux.routes[1].id=owners-service
spring.cloud.gateway.server.webflux.routes[1].uri=${OWNERS_ROUTE_URI:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].order=-1
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/owners,/api/owners/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[1].filters[1]=OwnersAvailability
spring.cloud.gateway.server.webflux.routes[1].metadata.connect-timeout=1500

# Somente paginas de Owner. Os caminhos /owners/{ownerId}/pets/** caem na rota do monolito.
spring.cloud.gateway.server.webflux.routes[2].id=owners-web
spring.cloud.gateway.server.webflux.routes[2].uri=${OWNERS_ROUTE_URI:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].order=-1
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/owners,/owners/find,/owners/new,/owners/{ownerId},/owners/{ownerId}/edit
spring.cloud.gateway.server.webflux.routes[2].filters[0]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[2].filters[1]=OwnersAvailability
spring.cloud.gateway.server.webflux.routes[2].metadata.connect-timeout=1500
spring.cloud.gateway.server.webflux.routes[2].metadata.response-timeout=5000

# Demais requisicoes - monolito legado
spring.cloud.gateway.server.webflux.routes[3].id=petclinic-monolith
spring.cloud.gateway.server.webflux.routes[3].uri=${MONOLITH_ROUTE_URI:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[3].order=0
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[3].filters[1]=SetRequestHeader=X-PetClinic-Gateway, true
