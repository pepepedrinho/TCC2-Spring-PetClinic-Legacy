spring.application.name=petclinic-gateway
server.port=8081

# API Owners/Pets - microsservico
spring.cloud.gateway.server.webflux.routes[0].id=owners-pets-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[0].order=-1
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/owners,/api/owners/**,/api/pets/**,/api/pet-types
spring.cloud.gateway.server.webflux.routes[0].filters[0]=PreserveHostHeader

# Demais requisicoes - monolito legado
spring.cloud.gateway.server.webflux.routes[1].id=petclinic-monolith
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[1].order=0
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=PreserveHostHeader