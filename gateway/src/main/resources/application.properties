spring.application.name=petclinic-gateway
server.port=8081

spring.cloud.gateway.server.webflux.routes[0].id=petclinic-monolith
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=PreserveHostHeader
