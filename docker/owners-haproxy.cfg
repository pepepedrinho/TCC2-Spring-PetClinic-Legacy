global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client 10s
    timeout server 10s
    # Retry a failed connect only, before an HTTP request could reach Owners.
    retries 1
    retry-on conn-failure
    option redispatch 1

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 10s

frontend owners
    bind :8082
    default_backend replicas

backend replicas
    balance roundrobin
    option httpchk GET /api/owners?lastName=Franklin
    http-check expect status 200
    http-response set-header X-Owners-Replica %[srv_name]
    server-template owners 2 owners-service:8082 check inter 1s fall 1 rise 1 init-state fully-down resolvers docker resolve-prefer ipv4 init-addr none
