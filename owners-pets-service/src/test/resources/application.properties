# Banco isolado para testes automatizados
spring.datasource.url=jdbc:h2:mem:ownerspets-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Criar o esquema e carregar os dados historicos em cada contexto de teste
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none